[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeqa"
version = "0.1.0"
description = "Единое окно Q&A по кодовым базам (RAG + wiki)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "qdrant-client>=1.10",
    "tree-sitter>=0.22",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-java",
    "tree-sitter-c-sharp",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-go",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
codeqa = "codeqa.cli:main"

[tool.setuptools.packages.find]
include = ["codeqa*"]
